name: CI Nuclone API - Pytest

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "features/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: nuclone_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1.  Baixa o código do repositório (para o poetry.lock existir)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2.  Instala o Poetry no ambiente
      - name: Install poetry
        run: pipx install poetry

      # 3.  Configura o Python + Cache do Poetry
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      # 4.  Instala as dependências do projeto
      - name: Install dependencies
        run: poetry install --no-interaction

      # 5.  Executa a suíte de testes
      - name: Run Pytest
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/nuclone_db"
        run: |
          poetry run pytest -v