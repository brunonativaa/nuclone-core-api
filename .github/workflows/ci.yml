name: CI Nuclone API - Pytest

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "features/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres_test_user
          POSTGRES_PASSWORD: test_password_12345
          POSTGRES_DB: nuclone_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run Pytest
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/nuclone_db"
        run: |
          poetry run pytest -v