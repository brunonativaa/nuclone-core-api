nome: CI Nuclone API - Pytest

on:
  push:
    branches: ["main", "develop", "feature/*", "feature/*, ]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest

  services:
      postgres:
        image: postgres:15
        env_file:
          POSTGRES_USER: ${POSTGRES_USER}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
          POSTGRES_DB: ${POSTGRES_DB}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
  
  steps:
      # 1. Baixa o código do seu repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o ambiente Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Instala o Poetry
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      # 4. Instala todas as dependências do projeto
      - name: Install dependencies
        run: poetry install

      # 5. Executa os testes automatizados do Pytest apontando para o PostgreSQL
      - name: Run Pytest
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/nuclone_db"
        run: |
          poetry run pytest -v