[project]
name = "projeto-nuclone"
version = "0.1.0"
description = ""
authors = [
    {name = "Bruno",email = "brunoferreirarodrigues26@outlook.com"}
]
packages = [
    { include = "src" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "fastapi (>=0.139.2,<0.140.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx2 (>=2.12.0,<3.0.0)",
    "mocker (>=1.1.1,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "alembic (>=1.19.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [".","src"]
markers = [
    "unit: Testes unitários do sistema.",
    "e2e: testes de ponta a ponta",
    
]

[dependency-groups]
dev = [
    "httpx2 (>=2.12.0,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "faker (>=40.37.0,<41.0.0)"
]



